# Text assets ship uncompressed by default on nginx:alpine; the inlined
# Tailwind block and three.js are the two big wins here.
gzip on;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_proxied any;
gzip_vary on;
gzip_types text/plain text/css application/javascript application/json
           image/svg+xml font/woff2 application/font-woff2;

# Fingerprint-free static assets, cached hard; the HTML stays revalidated.
location ~* \.(woff2|webp|jpg|png|mp4|js)$ {
  expires 30d;
  add_header Cache-Control "public, max-age=2592000";
}
